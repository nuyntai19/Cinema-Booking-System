services:
  db:
    image: mysql:8.0
    container_name: galaxy_cinema_db
    restart: unless-stopped
    command: --default-time-zone=+07:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-galaxy_cinema}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-12345678}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galaxy_cinema_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8080
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-galaxy_cinema}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      DB_CHARSET: utf8mb4
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/health') ? 0 : 1);" ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./source-code/galaxy-cinema-hub-main
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_PUSHER_KEY: ${VITE_PUSHER_KEY:-}
        VITE_PUSHER_CLUSTER: ${VITE_PUSHER_CLUSTER:-ap1}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
        VITE_ORS_API_KEY: ${VITE_ORS_API_KEY:-}
        VITE_ORS_API_KEY_2: ${VITE_ORS_API_KEY_2:-}
    container_name: galaxy_cinema_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
